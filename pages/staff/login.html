
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Airline Operations Staff Login Portal">
    <title>Staff Login | Airline Operations System</title>
</head>

<body>

    <header>
        <h1>Airline Operations System</h1>
        <p>Staff Portal</p>
    </header>

    <main>
        <section aria-labelledby="login-heading">

            <h2 id="login-heading">Welcome Back</h2>
            <p>Sign in to access the Airline Operations Management System.</p>

            <form id="staff-login-form">

                <div>
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your staff email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button type="button" id="toggle-password">
                        Show Password
                    </button>
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="remember-me"
                        name="remember-me"
                    >
                    <label for="remember-me">Remember me</label>
                </div>

                <div>
                    <a href="#">Forgot Password?</a>
                </div>

                <div
                    id="login-error"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>

                <button type="submit">Sign In</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Airline Operations System. All rights reserved.</p>
    </footer>

</body>
</html>
